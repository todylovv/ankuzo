# ANKUZO — the personal archive, published through the host's existing edge.
#
# Deliberately publishes no ports. Caddy reaches this container by name over
# the shared `edge` network on port 3000.
services:
  ankuzo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ankuzo:latest
    container_name: ankuzo
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    # Mount only the server-refreshed snapshots so bundled static sources
    # (for example yandex-music.json) remain available from the image.
    volumes:
      - ${ANKUZO_DATA:-/opt/ankuzo-data}/steam.json:/usr/share/nginx/html/data/steam.json:ro
      - ${ANKUZO_DATA:-/opt/ankuzo-data}/faceit.json:/usr/share/nginx/html/data/faceit.json:ro
      - ${ANKUZO_DATA:-/opt/ankuzo-data}/discord.json:/usr/share/nginx/html/data/discord.json:ro
      - ${ANKUZO_DATA:-/opt/ankuzo-data}/psn.json:/usr/share/nginx/html/data/psn.json:ro
    networks: [edge]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  edge:
    name: edge
    external: true
