name: Update PlayStation Profile

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch PlayStation trophy summary
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          PSN_ONLINE_ID: 'ankkui'
        run: |
          npm install --no-save psn-api@2.18.0
          node scripts/update-ps5-profile.mjs
          cp ps5-profile.json public/ps5-profile.json

      - name: Commit PlayStation profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ps5-profile.json public/ps5-profile.json
          git diff --staged --quiet || git commit -m "chore: update PlayStation profile [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push && exit 0
            sleep 2
          done
          exit 1
