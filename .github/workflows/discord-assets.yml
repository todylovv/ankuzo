name: Mirror Discord Assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/discord-assets.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Discord profile assets
        env:
          DISCORD_ID: '514852654552186880'
        run: |
          set -euo pipefail
          mkdir -p discord-assets

          curl --fail --silent --show-error --location \
            "https://api.lanyard.rest/v1/users/${DISCORD_ID}" > /tmp/lanyard.json
          curl --fail --silent --show-error --location \
            "https://japi.rest/discord/v1/user/${DISCORD_ID}" > /tmp/discord-profile.json ||
            echo '{"data":{}}' > /tmp/discord-profile.json

          avatar="$(jq -r '.data.discord_user.avatar // empty' /tmp/lanyard.json)"
          decoration="$(jq -r '.data.discord_user.avatar_decoration_data.asset // empty' /tmp/lanyard.json)"
          banner="$(jq -r '.data.banner // empty' /tmp/discord-profile.json)"

          if [ -n "$avatar" ]; then
            curl --fail --silent --show-error --location \
              "https://cdn.discordapp.com/avatars/${DISCORD_ID}/${avatar}.webp?size=256" \
              --output discord-assets/avatar.webp
          fi

          if [ -n "$decoration" ]; then
            curl --fail --silent --show-error --location \
              "https://cdn.discordapp.com/avatar-decoration-presets/${decoration}.png?size=256&passthrough=true" \
              --output discord-assets/avatar-decoration.png
          else
            rm -f discord-assets/avatar-decoration.png
          fi

          rm -f discord-assets/nameplate.webm

          if [ -n "$banner" ]; then
            curl --fail --silent --show-error --location \
              "https://cdn.discordapp.com/banners/${DISCORD_ID}/${banner}.webp?size=512" \
              --output discord-assets/banner.webp
          fi

          jq '{updated_at: (now | todateiso8601), discord_user: .data.discord_user}' \
            /tmp/lanyard.json > discord-assets/profile.json

      - name: Commit mirrored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop
          git add discord-assets
          git diff --staged --quiet || git commit -m "chore: mirror discord assets [skip ci]"
          git push
