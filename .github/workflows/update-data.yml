name: Update public profile data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/update-data.js"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-public-data
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PlayStation API client
        run: npm install --no-save --ignore-scripts psn-api@2.18.0

      - name: Update safe public JSON
        env:
          STEAM_KEY: ${{ secrets.STEAM_KEY }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          FACEIT_KEY: ${{ secrets.FACEIT_KEY }}
          TRN_KEY: ${{ secrets.TRN_KEY }}
          PSN_ONLINE_ID: ankkui
          DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID || '514852654552186880' }}
          DISCORD_BIO: ${{ vars.DISCORD_BIO }}
          FACEIT_NICKNAME: ${{ vars.FACEIT_NICKNAME }}
          TRN_PLATFORM: ${{ vars.TRN_PLATFORM }}
          TRN_USERNAME: ${{ vars.TRN_USERNAME }}
        run: node scripts/update-data.js

      - name: Verify updated project
        run: npm run check

      - name: Commit changed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet -I '"lastAttemptAt":' && exit 0
          git commit -m "chore: update public profile data"
          git pull --rebase origin main
          git push

      - uses: actions/configure-pages@v5

      - name: Build updated static site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy updated data
        id: deployment
        uses: actions/deploy-pages@v4
