name: Update safe public data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/update-data.js"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-safe-public-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install PlayStation API client for updater
        run: npm install --no-save --package-lock=false --ignore-scripts psn-api@2.18.0

      - name: Update client-safe snapshots
        env:
          STEAM_KEY: ${{ secrets.STEAM_KEY }}
          STEAM_IDS: ${{ vars.STEAM_IDS }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          PSN_ONLINE_ID: ${{ vars.PSN_ONLINE_ID || 'ankkui' }}
          DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID || '514852654552186880' }}
          DISCORD_BIO: ${{ vars.DISCORD_BIO }}
        run: npm run update-data

      - name: Verify application
        run: |
          npm run lint
          npm test

      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: update safe public data"
          git pull --rebase origin main
          git push origin HEAD:main
