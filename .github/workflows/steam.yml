name: Update Steam and Game Data

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/steam.yml'
      - 'build.py'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch data and build JSON
        env:
          STEAM_KEY: ${{ secrets.STEAM_KEY }}
          FACEIT_KEY: ${{ secrets.FACEIT_KEY }}
          TRN_KEY: ${{ secrets.TRN_KEY }}
          STEAM_ID1: '76561199770575251'
          STEAM_ID2: '76561198165374024'
        run: |
          curl --fail --silent --show-error "https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v2/?key=${STEAM_KEY}&steamids=${STEAM_ID1},${STEAM_ID2}" > /tmp/summary.json
          curl --fail --silent --show-error "https://api.steampowered.com/IPlayerService/GetRecentlyPlayedGames/v1/?key=${STEAM_KEY}&steamid=${STEAM_ID1}&count=5" > /tmp/recent1.json
          curl --fail --silent --show-error "https://api.steampowered.com/IPlayerService/GetRecentlyPlayedGames/v1/?key=${STEAM_KEY}&steamid=${STEAM_ID2}&count=5" > /tmp/recent2.json
          curl --fail --silent --show-error "https://api.steampowered.com/IPlayerService/GetOwnedGames/v1/?key=${STEAM_KEY}&steamid=${STEAM_ID1}&include_appinfo=true&include_played_free_games=true" > /tmp/owned1.json
          curl --fail --silent --show-error "https://api.steampowered.com/IPlayerService/GetOwnedGames/v1/?key=${STEAM_KEY}&steamid=${STEAM_ID2}&include_appinfo=true&include_played_free_games=true" > /tmp/owned2.json
          echo '{}' > /tmp/faceit.json
          echo '{}' > /tmp/apex.json
          FACEIT_KEY="$(printf '%s' "${FACEIT_KEY:-}" | tr -d '[:space:]')"
          TRN_KEY="$(printf '%s' "${TRN_KEY:-}" | tr -d '[:space:]')"
          faceit_status=missing
          apex_status=missing
          if [ -n "${FACEIT_KEY:-}" ]; then
            faceit_status="$(curl --silent --show-error \
              --header "Authorization: Bearer ${FACEIT_KEY}" \
              "https://open.faceit.com/data/v4/players?game=cs2&game_player_id=${STEAM_ID1}" \
              --output /tmp/faceit.json --write-out '%{http_code}' || true)"
            faceit_message="$(jq -r '.message // .errors[0].message // empty' /tmp/faceit.json 2>/dev/null || true)"
            [ "$faceit_status" = 200 ] || echo '{}' > /tmp/faceit.json
          fi
          if [ -n "${TRN_KEY:-}" ]; then
            apex_status="$(curl --silent --show-error \
              --header "TRN-Api-Key: ${TRN_KEY}" \
              "https://public-api.tracker.gg/v2/apex/standard/profile/steam/${STEAM_ID2}" \
              --output /tmp/apex.json --write-out '%{http_code}' || true)"
            apex_message="$(jq -r '.message // .errors[0].message // empty' /tmp/apex.json 2>/dev/null || true)"
            [ "$apex_status" = 200 ] || echo '{}' > /tmp/apex.json
          fi
          jq -n \
            --arg faceit "$faceit_status" --arg faceit_message "${faceit_message:-}" \
            --arg apex "$apex_status" --arg apex_message "${apex_message:-}" \
            '{faceit:$faceit,faceit_message:$faceit_message,apex:$apex,apex_message:$apex_message}' \
            > /tmp/integrations.json
          python3 build.py
          cp steam-data.json public/steam-data.json

      - name: Commit steam-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop
          git add steam-data.json public/steam-data.json
          git diff --staged --quiet || git commit -m "chore: update steam data [skip ci]"
          git push
