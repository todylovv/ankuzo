name: Update Steam Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Steam data
        env:
          STEAM_KEY: ${{ secrets.STEAM_KEY }}
          STEAM_ID: '76561199770575251'
        run: |
          # Player summary
          curl -s "https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v2/?key=${STEAM_KEY}&steamids=${STEAM_ID}" > /tmp/summary.json

          # Recently played games (last 2 weeks)
          curl -s "https://api.steampowered.com/IPlayerService/GetRecentlyPlayedGames/v1/?key=${STEAM_KEY}&steamid=${STEAM_ID}&count=5" > /tmp/recent.json

          # Top played games all time
          curl -s "https://api.steampowered.com/IPlayerService/GetOwnedGames/v1/?key=${STEAM_KEY}&steamid=${STEAM_ID}&include_appinfo=true&include_played_free_games=true" > /tmp/owned.json

          # Combine into one JSON
          python3 << 'EOF'
          import json, os

          summary = json.load(open('/tmp/summary.json'))
          recent  = json.load(open('/tmp/recent.json'))
          owned   = json.load(open('/tmp/owned.json'))

          player = summary.get('response',{}).get('players',[{}])[0]
          recent_games = recent.get('response',{}).get('games',[])
          owned_games  = owned.get('response',{}).get('games',[])

          # Sort owned by playtime, take top 8
          top = sorted(owned_games, key=lambda g: g.get('playtime_forever',0), reverse=True)[:8]
          total_hours = sum(g.get('playtime_forever',0) for g in owned_games) // 60
          total_games = len(owned_games)

          result = {
            'updated': __import__('datetime').datetime.utcnow().isoformat() + 'Z',
            'player': {
              'name':     player.get('personaname',''),
              'avatar':   player.get('avatarfull',''),
              'status':   player.get('personastate',0),
              'gameextrainfo': player.get('gameextrainfo',''),
              'gameid':   player.get('gameid',''),
            },
            'stats': {
              'total_games': total_games,
              'total_hours': total_hours,
            },
            'recent': [
              {
                'appid': g.get('appid'),
                'name':  g.get('name',''),
                'hours_2weeks': round(g.get('playtime_2weeks',0)/60,1),
                'hours_total':  round(g.get('playtime_forever',0)/60,1),
                'img': f"https://media.steampowered.com/steamcommunity/public/images/apps/{g.get('appid')}/{g.get('img_icon_url','')}.jpg"
              }
              for g in recent_games
            ],
            'top': [
              {
                'appid': g.get('appid'),
                'name':  g.get('name',''),
                'hours': round(g.get('playtime_forever',0)/60,1),
                'img_icon': g.get('img_icon_url',''),
              }
              for g in top
            ]
          }

          with open('steam-data.json','w') as f:
            json.dump(result, f, ensure_ascii=False, indent=2)

          print('Done:', result['player']['name'], '|', result['stats']['total_games'], 'games |', result['stats']['total_hours'], 'hours')
          EOF

      - name: Commit steam-data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add steam-data.json
          git diff --staged --quiet || git commit -m "chore: update steam data [skip ci]"
          git push
