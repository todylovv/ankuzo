<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><title>Ankuzo — перерыв</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-head-32.png?v=20261022"><link rel="icon" type="image/png" sizes="64x64" href="/favicon-head-64.png?v=20261022"><link rel="apple-touch-icon" sizes="180x180" href="/favicon-head-180.png?v=20261022"><link rel="stylesheet" href="scene.css"><link rel="stylesheet" href="break.css">
  <script src="timer.js" defer></script><script src="scene.js" defer></script><script src="smoke.js" defer></script>
</head>
<body data-scene="break">
  <main class="stage break-scene timer-hidden" id="stage" aria-label="Перерыв — Ankuzo">
    <div class="backstage" aria-hidden="true"></div>
    <div class="stage-light" aria-hidden="true"></div>
    <div class="mist-texture" aria-hidden="true"></div>
    <canvas class="smoke-canvas" id="smoke-canvas" aria-hidden="true"></canvas>
    <div class="break-brand">Ankuzo<span>.</span></div>
    <div class="card-fan" aria-hidden="true">
      <div class="floating-card fan-far-left"><div class="card-art"></div></div>
      <div class="floating-card fan-far-right"><div class="card-art"></div></div>
      <div class="floating-card fan-left"><div class="card-art"></div></div>
      <div class="floating-card fan-right"><div class="card-art"></div></div>
      <svg class="fan-ribbon-back" viewBox="0 0 1300 1000" fill="none"><defs><path id="fan-thread" d="M190 774 C-50 510 107 493 305 583 C552 695 169 173 405 251 C688 345 1004 139 1081 313 C1160 493 657 573 953 724 C1100 800 1154 659 1226 565"/><linearGradient id="fan-silk" x1="50" y1="250" x2="1150" y2="750" gradientUnits="userSpaceOnUse"><stop stop-color="#8c173b"/><stop offset=".26" stop-color="#ef7da6"/><stop offset=".5" stop-color="#c32d5d"/><stop offset=".8" stop-color="#f4a0bd"/><stop offset="1" stop-color="#971c45"/></linearGradient></defs><use href="#fan-thread" stroke="#130810" stroke-width="6" opacity=".7"/><use href="#fan-thread" stroke="url(#fan-silk)" stroke-width="2.2"/><use href="#fan-thread" stroke="#fbc5d6" stroke-width=".4" opacity=".5"/></svg>
      <div class="floating-card fan-center"><div class="card-art"></div></div>
    </div>
    <div class="motes" id="motes" aria-hidden="true"></div>
    <section class="copy" aria-label="Сообщение перерыва">
      <h1 class="scene-title" id="scene-title">Перерыв</h1>
      <p class="break-subtitle" id="scene-subtitle">Скоро вернусь</p>
      <div class="timer-block" id="timer-block" hidden>
        <p class="timer-caption" id="timer-caption">До возвращения</p>
        <div class="timer-display" id="timer-display" role="timer" aria-label="Осталось времени">05:00</div>
        <p class="finished-text" id="finished-text" hidden>Возвращаюсь</p>
      </div>
    </section>
    <svg class="threads" viewBox="0 0 1920 1080" fill="none" aria-hidden="true">
      <defs>
        <path id="break-thread" d="M-80 636 C105 465 51 750 306 744 C510 737 730 862 919 911 C1113 961 1030 781 1191 907 C1394 1066 1680 1059 2020 986"/>
        <linearGradient id="break-thread-color" x1="0" y1="820" x2="1920" y2="850" gradientUnits="userSpaceOnUse"><stop stop-color="#bc2b59"/><stop offset=".26" stop-color="#ef80a5"/><stop offset=".6" stop-color="#ca315f"/><stop offset="1" stop-color="#ef80a5"/></linearGradient>
        <radialGradient id="break-glint"><stop stop-color="#ffe5ed"/><stop offset="1" stop-color="#ff6e9b" stop-opacity="0"/></radialGradient>
      </defs>
      <use href="#break-thread" stroke="#c83169" stroke-width="16" opacity=".12"/>
      <use href="#break-thread" stroke="#64102e" stroke-width="6"/>
      <use href="#break-thread" stroke="url(#break-thread-color)" stroke-width="2.2"/>
      <g class="thread-spark"><ellipse rx="45" ry="2.8" fill="url(#break-glint)"/><animateMotion dur="31s" begin="-7s" repeatCount="indefinite" rotate="auto"><mpath href="#break-thread"/></animateMotion></g>
    </svg>
    <footer class="scene-footer"><span>twitch.tv/ankuzo</span><i aria-hidden="true"></i><span>ankuzo.online</span></footer>
  </main>
</body>
</html>
