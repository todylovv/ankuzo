<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-head-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-head-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-head-180.png" />
    <link rel="stylesheet" href="/art/bodoni.css" />
    <link rel="preload" as="fetch" href="/art/intro-portrait.json" crossorigin="anonymous" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Личный игровой архив ANKUZO: коллекция, статистика и игровые профили." />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <title>Ankuzo — по нити</title>

    <style id="intro-styles">
      html,body{margin:0;background:#050506}
      body.intro-pending{overflow:hidden}
      .site-intro{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;isolation:isolate;background:#050506;color:#f2f0ef;font-family:Arial,sans-serif;transition:opacity .45s ease,visibility .45s;touch-action:none}
      .site-intro:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 43%,#7b123315,transparent 52%)}
      .intro-number{position:absolute;top:32px;left:40px;color:#d6215a;font:italic 28px Georgia,serif}
      .intro-content{display:flex;align-items:center;flex-direction:column;transform:translateY(-10px)}
      .intro-portrait{position:relative;width:min(440px,90vw,61vh);aspect-ratio:360/387;margin-bottom:12px}
      .intro-name{margin:0;font:400 31px Georgia,serif;letter-spacing:.03em}
      .intro-loading{display:flex;align-items:center;gap:18px;margin-top:22px;color:#aaa4a8;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
      .intro-progress{height:1px;width:112px;background:#35222a;overflow:hidden}
      .intro-progress i{display:block;width:100%;height:100%;background:#d6215a;transform:scaleX(0);transform-origin:left;transition:transform .35s ease;box-shadow:0 0 8px #d6215a}
      .intro-skip{position:absolute;bottom:30px;right:40px;min-height:44px;padding:10px 0 10px 18px;border:0;background:transparent;color:#b9aeb3;font:12px Arial,sans-serif;cursor:pointer;letter-spacing:.04em}
      .intro-skip span{display:inline-block;margin-left:12px;color:#d6215a}
      .intro-skip:hover{color:#fff}.intro-skip:focus-visible{outline:1px solid #e24368;outline-offset:6px}
      .intro-exit{opacity:0;visibility:hidden;pointer-events:none}
      @media(max-width:600px){.intro-number{top:20px;left:24px}.intro-skip{bottom:20px;right:24px}.intro-portrait{width:min(91vw,440px,65svh);margin-bottom:8px}.intro-content{transform:translateY(-12px)}}
      @media(max-height:600px){.intro-portrait{width:min(70vh,70vw);margin-bottom:0}.intro-loading{margin-top:15px}.intro-name{font-size:26px}}
      .site-intro{transition:opacity .8s cubic-bezier(.22,.61,.36,1),visibility .8s}
      .site-intro:before{background:radial-gradient(ellipse at 50% 42%,#5a0d241a,transparent 56%)}
      .intro-content{transform:none;gap:0}
      .intro-portrait{width:min(570px,92vw,70svh);aspect-ratio:1;margin-bottom:0;transition:transform .85s cubic-bezier(.22,.61,.36,1),opacity .65s}
      .intro-art{position:absolute;inset:0;width:100%;height:100%;display:block}
      .intro-art-ready .intro-portrait{filter:drop-shadow(0 0 16px #bf1b3820)}
      .intro-name{font-family:"Bodoni Moda",Georgia,serif;font-size:clamp(34px,4.5vw,46px);letter-spacing:.015em;transition:transform .75s ease,opacity .5s ease}
      .intro-loading{margin-top:18px;gap:20px;font-size:10px;letter-spacing:.22em;transition:opacity .4s}
      .intro-progress{width:140px;background:#40202b;height:2px}
      .intro-progress i{background:linear-gradient(90deg,#7b1236,#ed376d);box-shadow:0 0 10px #c81d50}
      .intro-skip{right:32px;bottom:22px;padding:12px 16px;color:#c7bcc1}
      .intro-number{color:#b23b5b;font-size:26px;opacity:.72}
      .intro-exit .intro-portrait{transform:scale(1.075) translateY(-6px);opacity:0}
      .intro-exit .intro-name{transform:translateY(10px);opacity:0}
      .intro-exit .intro-loading{opacity:0}
      .intro-static *{animation:none!important;transition:none!important}
      .intro-static{transition:opacity .05s}
      @media(max-width:600px){.intro-portrait{width:min(98vw,68svh);margin-bottom:0}.intro-content{transform:translateY(-12px)}.intro-number{left:24px;top:22px}.intro-name{font-size:38px}.intro-skip{right:12px;bottom:12px}}
      @media(max-height:600px){.intro-portrait{width:min(70vh,65vw)}.intro-name{font-size:28px}.intro-loading{margin-top:10px}.intro-skip{bottom:8px}}
      @media(prefers-reduced-motion:reduce){.site-intro{transition:opacity .05s}.intro-progress i{transition:none}}
    </style>
  </head>
  <body class="intro-pending">
    <div id="site-intro" class="site-intro" aria-label="Загрузка страницы Ankuzo">
      <span class="intro-number" aria-hidden="true">22</span>
      <div class="intro-content">
        <div class="intro-portrait" aria-hidden="true"></div>
        <p class="intro-name">Ankuzo</p>
        <div class="intro-loading"><span role="status" aria-live="polite">Загрузка</span><span class="intro-progress" aria-hidden="true"><i></i></span></div>
      </div>
      <button class="intro-skip" type="button">Пропустить<span aria-hidden="true">↗</span></button>
    </div>
    <noscript><style>.site-intro{display:none}body.intro-pending{overflow:auto}</style><p style="color:#f2f0ef;padding:24px">Для игрового архива нужен JavaScript. Включи его и обнови страницу.</p></noscript>
    <div id="root" inert aria-busy="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
